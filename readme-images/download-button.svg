<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ccb5b"/>
      <stop offset="1" stop-color="#1f883d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="2" y="1" width="196" height="38" rx="8"/>
    </clipPath>
  </defs>

  <rect x="2" y="4" width="196" height="38" rx="8" fill="#116329"/>
  <rect x="2" y="1" width="196" height="38" rx="8" fill="url(#body)"/>
  <rect x="2.5" y="1.5" width="195" height="37" rx="7.5" fill="none" stroke="#000" stroke-opacity="0.12"/>

  <g clip-path="url(#clip)">
    <rect x="2" y="1" width="196" height="17" rx="8" fill="url(#gloss)"/>
    <rect x="-70" y="0" width="50" height="44" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-70;-70;280;280" keyTimes="0;0.86;0.98;1" dur="20s" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.6 1;0 0 1 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(30 20)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -8 V3"/>
    <path d="M-4.5 -1.5 L0 3 L4.5 -1.5"/>
    <path d="M-7 7 H7"/>
  </g>

  <text x="112" y="25" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#0b4d1f" fill-opacity="0.45">Download Game</text>
  <text x="112" y="24.5" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#fff">Download Game</text>
</svg>
