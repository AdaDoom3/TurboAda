name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=$(./.github/version.sh)" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ $GITHUB_REF_NAME == "v$VERSION" ]] ||
            { echo "::error file=turboada.c::tag $GITHUB_REF_NAME does not match the compiled version v$VERSION; retag, or fix TURBOADA_VERSION_MAJOR/_MINOR"; exit 1; }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }
          ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            { echo "::error::a release for $GITHUB_REF_NAME already exists; versions are published once"; exit 1; }

  package:
    name: package (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos, windows]
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[matrix.platform] }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          platform: ${{ matrix.platform }}

      - if: matrix.platform == 'windows'
        run: echo '${{ steps.toolchain.outputs.mingw }}' >> "$GITHUB_PATH"

      - if: matrix.platform != 'windows'
        run: make package TARGET=${{ matrix.platform }}

      - if: matrix.platform == 'windows'
        shell: cmd
        run: make.bat package

      - uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.platform }}
          path: builds/bin-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          path: builds
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: builds/*
