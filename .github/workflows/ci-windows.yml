name: Windows

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'readme-images/**']
  pull_request:
    paths-ignore: ['**.md', 'readme-images/**']
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/build.yml
    with:
      platform: windows
