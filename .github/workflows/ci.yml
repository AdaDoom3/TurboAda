name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'readme-images/**']
  pull_request:
    paths-ignore: ['**.md', 'readme-images/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos, windows]
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
