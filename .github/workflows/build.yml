name: build

on:
  workflow_call:
    inputs:
      platform:
        description: linux, macos or windows
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build + suite
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[inputs.platform] }}
    timeout-minutes: 120
    env:
      CI_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/toolchain
        with:
          platform: ${{ inputs.platform }}

      - if: inputs.platform == 'linux'
        run: python3 repro/linkage_check.py turboada.c

      - if: inputs.platform != 'windows'
        run: make ta

      - if: inputs.platform == 'windows'
        shell: cmd
        run: make.bat

      - if: inputs.platform != 'windows'
        run: bash test.sh ci

      - if: inputs.platform == 'windows'
        shell: msys2 {0}
        run: bash test.sh ci
