name: build

on:
  workflow_call:
    inputs:
      platform:
        description: linux, macos or windows
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build + suite
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[inputs.platform] }}
    timeout-minutes: 120
    env:
      CI_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        uses: ./.github/actions/toolchain
        with:
          platform: ${{ inputs.platform }}

      - name: build compiler
        if: inputs.platform != 'windows'
        run: make ta

      - name: build compiler
        if: inputs.platform == 'windows'
        shell: cmd
        run: make.bat

      - name: run suite
        if: inputs.platform != 'windows'
        run: bash test.sh ci

      - name: run suite
        if: inputs.platform == 'windows'
        shell: msys2 {0}
        run: bash test.sh ci

      - name: upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.platform }}
          path: |
            test_results/**/results.tsv
            test_results/**/test_summary.txt
            acats_logs/**
          if-no-files-found: ignore
          retention-days: 14
